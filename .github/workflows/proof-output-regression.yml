name: Proof Output Regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  proof-output-regression:
    name: Verify proof output golden snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Verify non-executing proof output snapshot
        run: npm run proof:end-to-end:non-executing:verify

      - name: Verify invocation denial proof
        run: npm run proof:invocation-denial:verify

      - name: Verify handler boundary denial proof
        run: npm run proof:handler-boundary-denial:verify

      - name: Verify surface boundary denial proof
        run: npm run proof:surface-boundary-denial:verify

      - name: Verify authority boundary denial proof
        run: npm run proof:authority-boundary-denial:verify

      - name: Verify agent context request boundary
        run: npm run contract:agent-context-request:verify

      - name: Verify local deterministic context source adapter
        run: npm run contract:local-deterministic-context-source:verify

      - name: Verify local v0 source catalog contracts
        run: npm run contract:local-v0-source-catalog:verify

      - name: Verify bounded real source adapter contract
        run: npm run contract:bounded-real-source-adapter:verify

      - name: Verify bounded real source adapter contract sample artifact
        run: npm run tool:bounded-real-source-adapter-contract-sample:verify

      - name: Verify narrow local real source read boundary contracts
        run: npm run contract:narrow-local-real-source-read-boundary:verify

      - name: Verify local real source adapter v0
        run: npm run tool:local-real-source-adapter-v0:verify

      - name: Verify local real source agent request runner v0
        run: npm run tool:local-real-source-agent-request-runner-v0:verify

      - name: Verify local real source single-command agent tool v0
        run: npm run tool:local-real-source-single-command-agent-tool-v0:verify

      - name: Verify local real source single-command sample artifacts
        run: npm run tool:local-real-source-single-command-sample:verify

      - name: Verify local real source tool pack artifacts
        run: npm run tool:local-real-source-tool-pack:verify

      - name: Verify local real source tool pack acceptance proof
        run: npm run proof:local-real-source-tool-pack-acceptance:verify

      - name: Verify local real source tool pack consumption CLI boundary
        run: npm run tool:local-real-source-tool-pack-consumption:verify

      - name: Verify local real source tool pack index consumption boundary
        run: npm run tool:local-real-source-tool-pack-index-consumption:verify

      - name: Verify local real source tool pack single-command consumption v0
        run: npm run tool:local-real-source-tool-pack-run-consume-v0:verify

      - name: Verify local real source tool pack single-command consumption sample artifacts
        run: npm run tool:local-real-source-tool-pack-run-consume-sample:verify

      - name: Verify local real source agent tool readiness index
        run: npm run tool:local-real-source-agent-tool-readiness-index:verify

      - name: Verify local real source agent tool readiness acceptance proof
        run: npm run proof:local-real-source-agent-tool-readiness-acceptance:verify

      - name: Verify local real source agent tool entrypoint v0
        run: npm run tool:local-real-source-agent-tool-entrypoint-v0:verify

      - name: Verify local real source agent tool entrypoint acceptance proof
        run: npm run proof:local-real-source-agent-tool-entrypoint-acceptance:verify

      - name: Verify local real source agent tool run receipt v0
        run: npm run tool:local-real-source-agent-tool-run-receipt-v0:verify

      - name: Verify local real source agent tool run receipt acceptance proof
        run: npm run proof:local-real-source-agent-tool-run-receipt-acceptance:verify

      - name: Verify agent-consumable response contract
        run: npm run contract:agent-consumable-response:verify

      - name: Verify first protocol-surface adapter shape
        run: npm run contract:first-protocol-surface-adapter:verify

      - name: Verify local JSON request-response runner shape
        run: npm run contract:local-json-request-response-runner:verify

      - name: Verify local JSON fixture runner proof
        run: npm run proof:local-json-fixture-runner:verify

      - name: Verify minimal local JSON fixture runner CLI boundary
        run: npm run contract:minimal-local-json-fixture-runner-cli-boundary:verify

      - name: Verify first local JSON CLI file IO boundary
        run: npm run tool:first-local-json-cli-file-io-boundary:verify

      - name: Verify local JSON request fixture authoring helper
        run: npm run tool:local-json-request-fixture-authoring:verify

      - name: Verify local JSON single-command run wrapper
        run: npm run tool:local-json-single-command-run:verify

      - name: Verify constrained local JSON request variation
        run: npm run tool:constrained-local-json-request-variation:verify

      - name: Verify minimal local source fixture selection
        run: npm run tool:minimal-local-source-fixture-selection:verify

      - name: Verify local JSON response observation summary
        run: npm run tool:local-json-response-observation-summary:verify

      - name: Verify agent-readable response use guidance
        run: npm run tool:agent-readable-response-use-guidance:verify

      - name: Verify agent request-response schema export
        run: npm run tool:agent-request-response-schema:verify

      - name: Verify schema-aware local JSON fixture examples
        run: npm run tool:schema-aware-local-json-examples:verify

      - name: Verify local JSON example artifact materialization
        run: npm run tool:local-json-example-artifacts:verify

      - name: Verify local JSON example artifact round-trip proof
        run: npm run proof:local-json-example-artifact-round-trip:verify

      - name: Verify local JSON agent tool manifest
        run: npm run tool:local-json-agent-tool-manifest:verify

      - name: Verify local JSON agent tool manifest artifact writer
        run: npm run tool:local-json-agent-tool-manifest-artifact:verify

      - name: Verify local JSON agent handoff bundle writer
        run: npm run tool:local-json-agent-handoff-bundle:verify

      - name: Verify local JSON agent handoff bundle round-trip proof
        run: npm run proof:local-json-agent-handoff-bundle-round-trip:verify

      - name: Verify local JSON agent handoff bundle consumption CLI boundary
        run: npm run tool:local-json-agent-handoff-bundle-consumption:verify

      - name: Verify local JSON agent request runner
        run: npm run tool:local-json-agent-request:run:verify

      - name: Verify local JSON agent request runner sample artifact set
        run: npm run tool:local-json-agent-request-runner-sample:verify

      - name: Verify local JSON agent local v0 tool pack artifact set
        run: npm run tool:local-json-agent-local-v0-tool-pack:verify

      - name: Verify local JSON agent local v0 acceptance proof
        run: npm run proof:local-json-agent-local-v0-acceptance:verify

      - name: Verify local v0 source catalog guided run proof
        run: npm run proof:local-v0-source-catalog-guided-run:verify

      - name: Verify local v0 source catalog guided command
        run: npm run tool:local-v0-source-catalog-guided:verify

      - name: Verify local v0 source catalog guided command sample artifacts
        run: npm run tool:local-v0-source-catalog-guided-sample:verify

      - name: Verify local v0 repo-work context guided sample artifacts
        run: npm run tool:local-v0-repo-work-context-guided-sample:verify

      - name: Verify local JSON agent local v0 single-command runner
        run: npm run tool:local-json-agent-local-v0:run:verify
